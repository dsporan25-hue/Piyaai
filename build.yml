name: Build CodeAI APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate full Android project
        run: |
          mkdir -p app/src/main/java/com/poran/codeai app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "CodeAI"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.poran.codeai'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.poran.codeai'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="Code AI"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/poran/codeai/MainActivity.kt <<'EOF'
          package com.poran.codeai

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.*
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          class MainActivity : Activity() {

              private lateinit var list: LinearLayout
              private lateinit var scroll: ScrollView
              private lateinit var input: EditText
              private var history = JSONArray()
              private val bg = Color.parseColor("#0B0B0F")
              private val red = Color.parseColor("#FF1744")
              private val panel = Color.parseColor("#17171F")

              private val system =
                  "You are an expert coding assistant. Reply in the same language the user writes " +
                  "(Bengali if they write Bengali). Always put code inside fenced code blocks " +
                  "with the language name. Give complete, working code and short explanations."

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              private fun prefs() = getSharedPreferences("s", Context.MODE_PRIVATE)

              private fun box(color: Int, r: Int = 14, stroke: Int = 0) = GradientDrawable().apply {
                  setColor(color); cornerRadius = dp(r).toFloat()
                  if (stroke != 0) setStroke(dp(1), stroke)
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(bg)
                      fitsSystemWindows = true
                  }

                  val top = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(14), dp(10), dp(8), dp(10))
                  }
                  top.addView(TextView(this).apply {
                      text = "Code AI"; textSize = 20f; setTextColor(red)
                      setTypeface(typeface, Typeface.BOLD)
                  }, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  top.addView(smallBtn("নতুন চ্যাট") {
                      history = JSONArray(); list.removeAllViews()
                  })
                  top.addView(smallBtn("সেটিংস") { showSettings() })
                  root.addView(top)

                  scroll = ScrollView(this)
                  list = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(10), dp(4), dp(10), dp(10))
                  }
                  scroll.addView(list)
                  root.addView(scroll, LinearLayout.LayoutParams(-1, 0, 1f))

                  val bar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(8), dp(6), dp(8), dp(8))
                  }
                  input = EditText(this).apply {
                      hint = "কোডিং প্রশ্ন বা কাজ লিখুন..."
                      setHintTextColor(Color.GRAY); setTextColor(Color.WHITE)
                      background = box(panel, 22, red)
                      setPadding(dp(16), dp(10), dp(16), dp(10))
                      maxLines = 5
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_MULTI_LINE
                  }
                  bar.addView(input, LinearLayout.LayoutParams(0, -2, 1f))
                  bar.addView(Button(this).apply {
                      text = "পাঠান"; setTextColor(Color.WHITE)
                      background = box(red, 22)
                      setOnClickListener { send() }
                  }, LinearLayout.LayoutParams(-2, -2).apply { leftMargin = dp(6) })
                  root.addView(bar)

                  setContentView(root)
                  bubbleAi("হ্যালো! আমি আপনার কোডিং এআই। সেটিংসে গিয়ে Gemini API Key দিন (aistudio.google.com থেকে ফ্রি), তারপর যেকোনো কোড লিখতে বা ঠিক করতে বলুন।")
                  if (prefs().getString("key", "").isNullOrEmpty()) showSettings()
              }

              private fun smallBtn(t: String, click: () -> Unit) = Button(this).apply {
                  text = t; textSize = 12f; setTextColor(Color.WHITE)
                  background = box(panel, 16, red)
                  setPadding(dp(10), 0, dp(10), 0)
                  minHeight = 0; minimumHeight = 0
                  layoutParams = LinearLayout.LayoutParams(-2, dp(36)).apply { leftMargin = dp(6) }
                  setOnClickListener { click() }
              }

              private fun showSettings() {
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; setPadding(dp(20), dp(10), dp(20), 0)
                  }
                  val key = EditText(this).apply {
                      hint = "Gemini API Key"; setText(prefs().getString("key", ""))
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                  }
                  val model = EditText(this).apply {
                      hint = "Model"; setText(prefs().getString("model", "gemini-2.0-flash"))
                  }
                  col.addView(key); col.addView(model)
                  AlertDialog.Builder(this).setTitle("সেটিংস").setView(col)
                      .setPositiveButton("সেভ") { _, _ ->
                          prefs().edit().putString("key", key.text.toString().trim())
                              .putString("model", model.text.toString().trim().ifEmpty { "gemini-2.0-flash" }).apply()
                      }.setNegativeButton("বাতিল", null).show()
              }

              private fun copy(t: String) {
                  (getSystemService(CLIPBOARD_SERVICE) as ClipboardManager)
                      .setPrimaryClip(ClipData.newPlainText("code", t))
                  Toast.makeText(this, "কপি হয়েছে", Toast.LENGTH_SHORT).show()
              }

              private fun addRow(v: View, right: Boolean) {
                  list.addView(v, LinearLayout.LayoutParams(-2, -2).apply {
                      topMargin = dp(8); gravity = if (right) Gravity.END else Gravity.START
                  })
                  scroll.post { scroll.fullScroll(View.FOCUS_DOWN) }
              }

              private fun bubbleUser(t: String) {
                  addRow(TextView(this).apply {
                      text = t; setTextColor(Color.WHITE); textSize = 15f
                      background = box(Color.parseColor("#7A0A22"), 16)
                      setPadding(dp(14), dp(10), dp(14), dp(10))
                      setOnLongClickListener { copy(t); true }
                  }, true)
              }

              private fun bubbleAi(t: String): View {
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = box(panel, 16)
                      setPadding(dp(12), dp(10), dp(12), dp(10))
                  }
                  val parts = t.split("```")
                  parts.forEachIndexed { i, p ->
                      if (i % 2 == 0) {
                          if (p.isNotBlank()) col.addView(TextView(this).apply {
                              text = p.trim(); setTextColor(Color.parseColor("#E8E8EE")); textSize = 15f
                              setTextIsSelectable(true)
                          })
                      } else {
                          val nl = p.indexOf('\n')
                          val lang = if (nl > 0) p.substring(0, nl).trim() else ""
                          val code = (if (nl >= 0) p.substring(nl + 1) else p).trimEnd()
                          val head = LinearLayout(this).apply {
                              orientation = LinearLayout.HORIZONTAL
                              gravity = Gravity.CENTER_VERTICAL
                              setPadding(dp(10), dp(4), dp(6), dp(4))
                              setBackgroundColor(Color.parseColor("#2A0A12"))
                          }
                          head.addView(TextView(this).apply {
                              text = lang.ifEmpty { "code" }; setTextColor(red); textSize = 12f
                          }, LinearLayout.LayoutParams(0, -2, 1f))
                          head.addView(TextView(this).apply {
                              text = "কপি"; setTextColor(Color.WHITE); textSize = 12f
                              setPadding(dp(10), dp(4), dp(10), dp(4))
                              setOnClickListener { copy(code) }
                          })
                          head.addView(TextView(this).apply {
                              text = "শেয়ার"; setTextColor(Color.WHITE); textSize = 12f
                              setPadding(dp(10), dp(4), dp(10), dp(4))
                              setOnClickListener {
                                  startActivity(Intent.createChooser(Intent(Intent.ACTION_SEND).apply {
                                      type = "text/plain"; putExtra(Intent.EXTRA_TEXT, code)
                                  }, "Share code"))
                              }
                          })
                          col.addView(head, LinearLayout.LayoutParams(-1, -2).apply { topMargin = dp(8) })
                          val hs = HorizontalScrollView(this).apply {
                              setBackgroundColor(Color.parseColor("#0A0A0F"))
                          }
                          hs.addView(TextView(this).apply {
                              text = code; setTextColor(Color.parseColor("#9CFF9C")); textSize = 12.5f
                              typeface = Typeface.MONOSPACE
                              setPadding(dp(10), dp(8), dp(10), dp(8))
                              setTextIsSelectable(true)
                          })
                          col.addView(hs, LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = dp(6) })
                      }
                  }
                  addRow(col, false)
                  return col
              }

              private fun send() {
                  val text = input.text.toString().trim()
                  if (text.isEmpty()) return
                  val key = prefs().getString("key", "") ?: ""
                  if (key.isEmpty()) { showSettings(); return }
                  val model = prefs().getString("model", "gemini-2.0-flash") ?: "gemini-2.0-flash"
                  input.setText("")
                  bubbleUser(text)
                  history.put(JSONObject().put("role", "user")
                      .put("parts", JSONArray().put(JSONObject().put("text", text))))
                  val wait = bubbleAi("ভাবছি...")
                  val snapshot = JSONArray(history.toString())
                  Thread {
                      val result = try {
                          call(key, model, snapshot)
                      } catch (e: Exception) {
                          "ত্রুটি: ${e.message}"
                      }
                      runOnUiThread {
                          list.removeView(wait)
                          bubbleAi(result)
                          history.put(JSONObject().put("role", "model")
                              .put("parts", JSONArray().put(JSONObject().put("text", result))))
                      }
                  }.start()
              }

              private fun call(key: String, model: String, contents: JSONArray): String {
                  val url = URL("https://generativelanguage.googleapis.com/v1beta/models/$model:generateContent?key=$key")
                  val c = url.openConnection() as HttpURLConnection
                  c.requestMethod = "POST"
                  c.connectTimeout = 20000; c.readTimeout = 120000
                  c.setRequestProperty("Content-Type", "application/json")
                  c.doOutput = true
                  val body = JSONObject()
                      .put("system_instruction", JSONObject().put("parts",
                          JSONArray().put(JSONObject().put("text", system))))
                      .put("contents", contents)
                  c.outputStream.use { it.write(body.toString().toByteArray()) }
                  val code = c.responseCode
                  val stream = if (code in 200..299) c.inputStream else c.errorStream
                  val resp = stream.bufferedReader().use { it.readText() }
                  if (code !in 200..299) {
                      val msg = try { JSONObject(resp).getJSONObject("error").getString("message") } catch (e: Exception) { resp }
                      return "API ত্রুটি ($code): $msg"
                  }
                  val parts = JSONObject(resp).getJSONArray("candidates").getJSONObject(0)
                      .getJSONObject("content").getJSONArray("parts")
                  val sb = StringBuilder()
                  for (i in 0 until parts.length()) sb.append(parts.getJSONObject(i).optString("text"))
                  return sb.toString()
              }
          }
          EOF

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: CodeAI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
